name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nysc_ci
      NEXTAUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nysc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nysc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test:security-boundaries
      - run: pnpm test:security-files
      - run: pnpm test:security-headers
      - run: pnpm test:authz:policy
